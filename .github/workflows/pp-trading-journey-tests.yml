name: PP Trading Journey tests

on:
  push:
    branches:
      - main
      - feature/automatic-funded-phases
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check application JavaScript syntax
        run: |
          node --check js-v5/app.js
          node --check js-v5/views.js
          node --check js-v5/data.js
          node --check js-v5/charts.js
      - name: Run application tests
        run: |
          npm test
